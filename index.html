<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F172A">
  <meta name="description" content="MakerLink — Conecte ideias. Construa o futuro. Protótipo acadêmico de uma comunidade maker.">
  <title>MakerLink · Início</title>
  <link rel="icon" href="assets/icons/chip.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/data.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/onboarding.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <main id="auth-main" class="auth-layout" tabindex="-1" hidden></main>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <aside class="sidebar" id="sidebar" aria-label="Menu principal" hidden>
    <a class="brand" href="#inicio"><img src="assets/icons/chip.svg" alt="" width="34" height="34">Maker<span>Link</span></a>
    <p class="sidebar-label">SEU ESPAÇO MAKER</p>
    <nav id="navigation" aria-label="Navegação principal"></nav>
    <div class="sidebar-bottom"><div class="mini-card"><span class="eyebrow">FEITO PARA CONSTRUIR JUNTOS</span><p>Uma ideia cresce quando é compartilhada.</p><span class="tag">Comunidade em construção</span></div><button class="user-button" data-route="perfil"><span class="avatar">EC</span><span><strong>Eduardo Costa</strong><small>Aprendiz · Nível 1</small></span><span class="user-more">•••</span></button></div>
  </aside>
  <div class="workspace" hidden>
    <header class="topbar">
      <button class="icon-button mobile-toggle" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar"></button>
      <form class="search" id="search-form" role="search"><span id="search-icon"></span><input id="global-search" aria-label="Pesquisar no MakerLink" placeholder="Pesquise ideias, pessoas e comunidades" autocomplete="off"><kbd>/</kbd></form>
      <span class="prototype-label">PROTÓTIPO ACADÊMICO</span>
      <button class="icon-button" id="notifications" aria-label="Abrir notificações"></button>
      <button class="avatar avatar-small" data-route="perfil" aria-label="Acessar meu perfil">EC</button>
      <button class="text-button" id="logout">Sair</button>
    </header>
    <div class="content-layout"><main id="main" tabindex="-1"></main><aside class="rightbar" id="complementary" aria-label="Informações da comunidade"></aside></div>
    <footer>MakerLink · Conecte ideias. Construa o futuro.<span>Projeto acadêmico · TIC / UFSC</span></footer>
  </div>
  <div class="menu-backdrop" id="menu-backdrop" hidden></div>
  <dialog id="info-dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><span class="eyebrow">MAKERLINK</span><button class="icon-button" id="close-dialog" aria-label="Fechar modal">×</button></div><h2 id="dialog-title"></h2><div id="dialog-content"></div><button class="button primary" id="dialog-confirm">Entendi</button></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
